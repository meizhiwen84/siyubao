<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>聊天内容预览</title>
    <style>
        html, body { height: 100%; }
        body { margin: 0; background: #f3f4f6; display: flex; align-items: center; justify-content: center; padding: 18px; box-sizing: border-box; }
        .shell { width: 390px; height: 844px; max-width: 96vw; max-height: 92vh; background: #000; border-radius: 34px; padding: 12px; box-sizing: border-box; box-shadow: 0 20px 55px rgba(0,0,0,0.25); }
        .screen { width: 100%; height: 100%; background: #fff; border-radius: 26px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
    </style>
</head>
<body>
<div class="shell">
    <div class="screen">
        <iframe th:src="@{'/reGenerateDyChat'(xianshiname=${xianshiname}, platform=${platform},xianlu=${xianlu}, userName=${userName}, userAvatar=${userAvatar}, chatContent=${chatContent})}" title="手机预览"></iframe>
    </div>
</div>
</body>
</html>
