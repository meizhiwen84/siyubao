<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡密验证</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f7f7f7; }
        .container { max-width: 520px; margin: 60px auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.08); }
        h1 { font-size: 20px; margin: 0 0 16px; }
        .desc { color: #666; margin-bottom: 12px; }
        .error { color: #c00; margin-bottom: 12px; }
        input[type=text] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
        button { margin-top: 16px; width: 100%; padding: 12px; background: #007bff; color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        button:disabled { background: #aaa; cursor: not-allowed; }
    </style>
    <script>
        function onSubmit(e) {
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>卡密验证</h1>
        <div class="desc">请输入有效卡密后进入聊天预览页面。</div>
        <div class="error" th:if="${error}" th:text="${error}"></div>
        <form method="post" action="/card-verify" onsubmit="onSubmit(event)">
            <input type="text" name="code" placeholder="请输入卡密" required />
            <button id="submitBtn" type="submit">验证并进入</button>
        </form>
    </div>
</body>
</html>
