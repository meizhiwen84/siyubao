<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡密配置</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fafafa; }
        .container { max-width: 900px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.06); }
        h1 { font-size: 22px; margin: 0 0 16px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; }
        .form-inline input { padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
        .form-inline button { padding: 8px 14px; border: none; border-radius: 6px; background: #007bff; color: #fff; cursor: pointer; }
        .actions button { margin-right: 8px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; }
        .badge-on { background: #e6f4ff; color: #1677ff; }
        .badge-off { background: #fff1f0; color: #cf1322; }
        .pagination { margin-top: 16px; }
        .pagination a { margin-right: 8px; }
    </style>
</head>
<body>
<div class="container">
    <h1>卡密配置</h1>

    <form class="form-inline" method="post" action="/card-config/create">
        <input type="text" name="code" placeholder="卡密" required />
        <input type="number" name="total" placeholder="总次数" min="1" required />
        <button type="submit">新增</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>卡密</th>
                <th>总次数</th>
                <th>剩余</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="k : ${page.content}">
                <td th:text="${k.id}"></td>
                <td th:text="${k.code}"></td>
                <td th:text="${k.total}"></td>
                <td th:text="${k.remaining}"></td>
                <td>
                    <span th:classappend="${k.enabled} ? 'badge badge-on' : 'badge badge-off'" th:text="${k.enabled} ? '启用' : '停用'"></span>
                </td>
                <td class="actions">
                    <form method="post" action="/card-config/update" style="display:inline">
                        <input type="hidden" name="id" th:value="${k.id}" />
                        <input type="number" name="total" placeholder="总次数" min="1" />
                        <input type="number" name="remaining" placeholder="剩余" min="0" />
                        <button type="submit">保存</button>
                    </form>
                    <form method="post" action="/card-config/toggle" style="display:inline">
                        <input type="hidden" name="id" th:value="${k.id}" />
                        <input type="hidden" name="enabled" th:value="${!k.enabled}" />
                        <button type="submit" th:text="${k.enabled} ? '停用' : '启用'"></button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <div class="pagination">
        <a th:if="${page.hasPrevious()}" th:href="@{'/card-config'(page=${page.number-1},size=${page.size})}">上一页</a>
        <span th:text="${page.number+1}"></span>/<span th:text="${page.totalPages}"></span>
        <a th:if="${page.hasNext()}" th:href="@{'/card-config'(page=${page.number+1},size=${page.size})}">下一页</a>
    </div>

    <div style="margin-top:12px"><a href="/chat-preview">进入聊天预览</a></div>
</div>
</body>
</html>
