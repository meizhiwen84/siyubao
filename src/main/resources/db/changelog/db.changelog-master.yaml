databaseChangeLog:
  - changeSet:
      id: 20260403-01-routes-add-card-key-column
      author: trae
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            tableName: ROUTES
        - not:
            columnExists:
              tableName: ROUTES
              columnName: CARD_KEY
      changes:
        - addColumn:
            tableName: ROUTES
            columns:
              - column:
                  name: CARD_KEY
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: ROUTES
            columnName: CARD_KEY

  - changeSet:
      id: 20260403-02-routes-create-card-key-index
      author: trae
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            tableName: ROUTES
        - columnExists:
            tableName: ROUTES
            columnName: CARD_KEY
        - not:
            indexExists:
              tableName: ROUTES
              indexName: IDX_ROUTES_CARD_KEY
      changes:
        - createIndex:
            tableName: ROUTES
            indexName: IDX_ROUTES_CARD_KEY
            columns:
              - column:
                  name: CARD_KEY
      rollback:
        - dropIndex:
            tableName: ROUTES
            indexName: IDX_ROUTES_CARD_KEY
