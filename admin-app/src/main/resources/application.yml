server:
  port: 6943

spring:
  thymeleaf:
    mode: HTML
    suffix: .html
    cache: false

  sql:
    init:
      mode: always

  datasource:
    url: jdbc:h2:file:./data/siyubao-admin;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console
