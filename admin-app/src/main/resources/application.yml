server:
  port: 6943

spring:
  thymeleaf:
    mode: HTML
    suffix: .html
    cache: false

  datasource:
    url: jdbc:sqlite:${SIYUBAO_ADMIN_DB_PATH:${user.home}/.siyubao-admin/data/siyubao-admin.db}
    driver-class-name: org.sqlite.JDBC
    username:
    password:

  jpa:
    database-platform: cn.laobayou.siyubao.config.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

sxjw:
  seed:
    mode: ${SXJW_SEED_MODE:PROD}
  admin:
    init-username: ${SXJW_ADMIN_INIT_USERNAME:admin}
    init-password: ${SXJW_ADMIN_INIT_PASSWORD:admin123456}
    force-reset: ${SXJW_ADMIN_FORCE_RESET:false}
