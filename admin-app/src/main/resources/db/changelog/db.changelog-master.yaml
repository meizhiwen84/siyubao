databaseChangeLog:
  - changeSet:
      id: 20260411-01-fix-existing-schema
      author: trae
      changes:
        # 创建缺失的app_setting表
        - createTable:
            tableName: app_setting
            columns:
              - column:
                  name: k
                  type: VARCHAR(128)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: v
                  type: TEXT
              - column:
                  name: update_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        
        # 为admin_op_log表创建缺失的索引（使用Liquibase的createIndex标签）
        - createIndex:
            tableName: admin_op_log
            indexName: idx_admin_op_log_time
            columns:
              - column:
                  name: create_time
        
        - createIndex:
            tableName: admin_op_log
            indexName: idx_admin_op_log_admin
            columns:
              - column:
                  name: admin_user_id
              - column:
                  name: create_time
        
        # 为app_setting表创建索引
        - createIndex:
            tableName: app_setting
            indexName: idx_app_setting_time
            columns:
              - column:
                  name: update_time
