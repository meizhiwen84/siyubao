databaseChangeLog:
  - changeSet:
      id: 20260412-01-create-app-user-table
      author: trae
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            tableExists:
              tableName: app_user
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: create_time
                  type: DATETIME
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: app_user

  - changeSet:
      id: 20260412-02-create-app-user-username-index
      author: trae
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            tableName: app_user
        - not:
            indexExists:
              tableName: app_user
              indexName: idx_app_user_username
      changes:
        - createIndex:
            tableName: app_user
            indexName: idx_app_user_username
            unique: true
            columns:
              - column:
                  name: username
      rollback:
        - dropIndex:
            tableName: app_user
            indexName: idx_app_user_username

