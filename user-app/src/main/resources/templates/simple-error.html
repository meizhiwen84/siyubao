<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提示</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f7f7f7; }
        .box { max-width: 520px; margin: 40px auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,0.06); text-align: center; }
        .msg { color: #cf1322; font-size: 16px; margin-bottom: 12px; }
        a { color: #1677ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <div class="msg" th:text="${message} ?: '操作失败'"></div>
        <div><a href="/app/login">返回登录</a></div>
    </div>
</body>
</html>
