<!DOCTYPE html>
<html lang="zh-CN" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>抖音私信聊天页面</title>
    <script src="./xhs/tailwindcss.min.js"></script>
    <link href="./xhs/font-awesome.min.css" rel="stylesheet">
    <style>
        /* 自定义适配抖音样式的细节 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        /* 手机屏幕模拟器 */
        .phone-container {
            width: 400px;
            height: 812px;
            background-color: #fff;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .chat-container {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        /* 顶部状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px 4px;
            background-color: #f5f5f5;
            font-size: 14px;
            font-weight: 500;
        }
        
        .status-bar-left,
        .status-bar-right {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .chat-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .chat-bubble-left {
            border-radius: 18px 18px 18px 4px !important;
            display: inline-block !important;
            max-width: 100% !important;
        }
        
        .message-wrapper {
            max-width: 75% !important;
        }
        
        .chat-bubble-right {
            border-radius: 18px !important;
        }
        
        .avatar-circle {
            clip-path: circle(50% at 50% 50%);
        }
        
        /* 滚动条样式 */
        .chat-content::-webkit-scrollbar {
            width: 4px;
        }
        
        .chat-content::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .chat-content::-webkit-scrollbar-thumb {
            background: #e0e0e0;
            border-radius: 2px;
        }
        
        /* 隐藏快捷回复按钮的滚动条 */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .dibu{
                padding: 0 10px;
                border-radius: 10px;
                background-color: white;
        }

        .py-4 {
            padding-bottom: initial !important;
        }
        .fa-video-camera {
            color: transparent !important;
            -webkit-text-stroke: 1.5px #000 !important;
            text-stroke: 1.5px #000 !important;
            -webkit-text-fill-color: transparent !important;
        }

.fa-th-large {
  display: inline-block;
  font: normal normal normal 14px/1 FontAwesome;
  font-size: inherit;
  text-rendering: auto;
  -webkit-font-smoothing: antialiased;

  color: transparent !important;
  -webkit-text-stroke: 1.5px #000 !important;
  -webkit-text-fill-color: transparent !important;

}
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        douyin: {
                            bg: '#f5f5f5',
                            text: '#333333',
                            lightText: '#999999',
                            blue: '#007aff',
                            white: '#ffffff',
                            border: '#e5e5e5'
                        }
                    },
                    fontSize: {
                        'chat-sm': '0.875rem',
                        'chat-md': '0.9375rem'
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div class="phone-container">
        <div class="chat-container bg-douyin-bg">
    <!-- 顶部状态栏 -->
    <div class="status-bar">
        <div class="status-bar-left">
            <span class="current-time">20:25</span>
        </div>
        <div class="status-bar-right">
            <i class="fa fa-wifi"></i>
            <i class="fa fa-signal"></i>
            <span>86%</span>
            <i class="fa fa-battery-full"></i>
        </div>
    </div>
    <!-- 顶部导航栏 -->
    <header class="border-b border-douyin-border sticky top-0 z-10">
        <div class="flex items-center justify-between px-4 py-3">
            <!-- 返回按钮 -->
            <div class="flex items-center">
                <button class="text-douyin-text mr-4">
                    <i class="fa fa-angle-left text-xl"></i>
                </button>
                <!-- 头像 -->
                <img th:src="${userPic}" 
                     th:alt="${userName}" 
                     class="w-10 h-10 avatar-circle mr-2" 
                     data-siyubao-avatar="user">
                <!-- 昵称和状态 -->
                <div>
                    <h1 class="text-douyin-text font-medium text-base" th:text="${userName}">曾经的少年</h1>
                    <p class="text-douyin-lightText text-xs">今天在线</p>
                </div>
            </div>
            <!-- 右侧功能按钮 -->
            <div class="flex items-center">
                <button class="text-douyin-text mr-4">
                    <i class="fa fa-video-camera text-xl"></i>
                </button>
                <button class="text-douyin-text">
                    <i class="fa fa-ellipsis-h text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 聊天内容区域 -->
    <main class="chat-content px-4 py-4">
        <!-- 顶部时间 -->
        <div class="mb-6">
            <p class="text-center text-douyin-lightText text-xs mb-4" th:text="${topTime}" th:attr="data-siyubao-top-time=1">2024/05/14 21:41</p>
            
            <!-- 欢迎消息 -->
            <div class="flex items-end justify-end mb-3" data-siyubao-wrap="1" data-siyubao-ignore="1">
                <div class="bg-douyin-blue chat-bubble-right px-4 py-2 text-white text-chat-md max-w-[75%] mr-2" th:text="${welcomword}" data-siyubao-idx="-1" data-siyubao-type="2" data-siyubao-time="${topTime}" data-siyubao-content="1">
                    你好，我需要咨询一下相关服务
                </div>
                <img th:src="${myPic}" 
                     alt="自己头像" 
                     class="w-10 h-10 avatar-circle" 
                     data-siyubao-avatar="me">
            </div>
            
            <!-- 平台提示 -->
<!--            <div class="text-center mb-6">-->
<!--                <p class="text-douyin-lightText text-xs" th:text="${userName}">曾经的少年</p>-->
<!--                <p class="text-douyin-lightText text-xs">已接入</p>-->
<!--            </div>-->
            
            <!-- 消息列表 -->
            <div th:each="cm,cmStats: ${msgList}">
                <p class="text-center text-douyin-lightText text-xs mb-4" th:if="${cm.showTime}" th:text="${cm.dateTimeStr}" th:attr="data-siyubao-time-for=${cmStats.index}">2025/04/08 10:02</p>
                
                <!-- 对方消息 -->
                <div class="flex items-start mb-3" th:class="${cm.msgType==1?'flex items-start mb-3':'flex items-end justify-end mb-3'}" data-siyubao-wrap="1">
                    <div th:if="${cm.msgType==1}" class="mr-2 mt-1">
                        <img th:src="${userPic}" 
                             th:alt="${userName}" 
                             class="w-10 h-10 avatar-circle" 
                             data-siyubao-avatar="user">
                    </div>
                    
                    <div class="message-wrapper" th:class="${cm.msgType==1?'message-wrapper':'max-w-[75%] mr-2'}">
                        <div th:class="${cm.msgType==1?'bg-douyin-white chat-bubble-left px-4 py-2 text-douyin-text text-chat-md':'bg-douyin-blue chat-bubble-right px-4 py-2 text-white text-chat-md'}" 
                             th:attr="data-siyubao-idx=${cmStats.index},data-siyubao-type=${cm.msgType},data-siyubao-time=${cm.dateTimeStr},data-siyubao-content=${cm.contentType}">
                            <img th:if="${cm.contentType==2}" th:src="${cm.msg}" class="max-w-full rounded-lg">
                            <span th:if="${cm.contentType!=2}" th:text="${cm.msg}">消息内容</span>
                        </div>
                    </div>
                    
                    <div th:if="${cm.msgType==2}">
                        <img th:src="${myPic}" 
                             alt="自己头像" 
                             class="w-10 h-10 avatar-circle" 
                             data-siyubao-avatar="me">
                    </div>
                </div>
            </div>
            
            <!-- 已读标记 -->
            <div class="flex items-end justify-end mb-3" data-siyubao-read="1" style="display: flex !important;">
                <p class="text-douyin-lightText text-xs text-right mr-2" data-siyubao-read-text="1" th:text="${readText?: '已读'}">已读</p>
                <div class="w-8"></div>
            </div>


        </div>
    </main>
            <!-- 快捷回复按钮 -->
            <div class="flex justify-center gap-2  overflow-x-auto  hide-scrollbar">
                <button class="bg-douyin-white  border-douyin-border rounded-full px-3 py-1 text-douyin-text text-sm flex items-center flex-shrink-0">
                    <i class="fa fa-star text-yellow-400 mr-1"></i> 晚上好
                </button>
                <button class="bg-douyin-white  border-douyin-border rounded-full px-3 py-1 text-douyin-text text-sm flex items-center flex-shrink-0">
                    <i class="fa fa-heart text-red-400 mr-1"></i> 比心
                </button>
                <button class="bg-douyin-white  border-douyin-border rounded-full px-3 py-1 text-douyin-text text-sm flex items-center flex-shrink-0">
                    <i class="fa fa-thumbs-up text-orange-400 mr-1"></i> 赞
                </button>
                <button class="bg-douyin-white  border-douyin-border rounded-full px-3 py-1 text-douyin-text text-sm flex items-center flex-shrink-0">
                    <i class="fa fa-hand-paper-o text-blue-400 mr-1"></i> 捂脸
                </button>
                <button class="bg-douyin-white  border-douyin-border rounded-full px-3 py-1 text-douyin-text text-sm flex items-center flex-shrink-0">
                    <i class="fa fa-heart text-pink-400 mr-1"></i> 玫瑰
                </button>
            </div>

    <!-- 底部输入框 -->
    <footer class="border-douyin-border px-3 py-2">
        <div class="flex items-center gap-3 dibu">
            <!-- 麦克风按钮 -->
            <button class="text-douyin-text flex-shrink-0">
                <img src="/avatar/yy.png" alt="语音" style="width: 30px; height: 30px; object-fit: contain; background-color: #ededed; border-radius: 50%;">
            </button>
            <!-- 输入框 -->
            <div class="flex-1 relative">
                <input type="text" placeholder="发送消息" 
                       class="w-full rounded-full  py-2 text-douyin-text outline-none">
            </div>
            <!-- 功能按钮 -->
            <div class="flex items-center gap-4 flex-shrink-0">
                <button class="text-douyin-text">
                    <i class="fa fa-th-large text-2xl"></i>
                </button>
                <button class="text-douyin-text">
                    <img src="/avatar/bq.png" alt="表情" style="width: 30px; height: 30px; object-fit: contain; background-color: #ededed; border-radius: 50%;">
                </button>
                <button class="text-douyin-text">
                    <img src="/avatar/fs.png" alt="发送" style="width: 30px; height: 30px; object-fit: contain; background-color: #ededed; border-radius: 50%;">
                </button>
            </div>
        </div>
    </footer>
        </div>
    </div>
    
    <script>
        // 更新当前时间（24小时制）
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const timeElement = document.querySelector('.current-time');
            if (timeElement) {
                timeElement.textContent = `${hours}:${minutes}`;
            }
        }

        // 每分钟更新一次时间
        updateTime();
        setInterval(updateTime, 60000);
    </script>
</body>
</html>
