<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>聊天记录查询</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial; margin: 0; background: #f7f8fa; color: #222; }
        .container { max-width: 1080px; margin: 0 auto; padding: 16px; }
        .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); }
        .header { padding: 16px; border-bottom: 1px solid #f0f2f5; font-weight: 600; }
        .form { padding: 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .form .field { display: flex; flex-direction: column; }
        .form label { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
        .form input, .form select { height: 36px; border: 1px solid #d1d5db; border-radius: 8px; padding: 0 10px; outline: none; }
        .actions { padding: 0 16px 16px; display: flex; gap: 8px; }
        .btn { height: 36px; padding: 0 14px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; cursor: pointer; }
        .btn.primary { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        .table-wrap { padding: 0 16px 16px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #f1f5f9; padding: 10px; text-align: left; font-size: 13px; }
        th { background: #f8fafc; color: #374151; }
        .pagination { display: flex; gap: 6px; padding: 12px 16px; border-top: 1px solid #f1f5f9; }
        .page-btn { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; }
        .page-btn.active { background: #0ea5e9; color: #fff; border-color: #0ea5e9; }
        .error { color: #b91c1c; padding: 8px 16px; }
        @media (max-width: 768px) { .form { grid-template-columns: repeat(2, 1fr); } .actions { flex-wrap: wrap; } }
        @media (max-width: 480px) { .form { grid-template-columns: 1fr; } }

        /* 预览弹窗样式 */
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal { width: 480px; height: 920px; max-width: 96vw; max-height: 92vh; background: #fff; border-radius: 14px; box-shadow: 0 12px 34px rgba(0,0,0,0.18); overflow: hidden; display:flex; flex-direction:column; }
        .modal-header { display:flex; align-items:center; justify-content:space-between; padding: 10px 12px; border-bottom: 1px solid #eef2f7; }
        .modal-header .title { font-size: 14px; font-weight: 600; }
        .close-btn { height: 28px; padding: 0 10px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; }
        .modal-body { padding: 0; background:#f7f8fa; flex:1; }
        .modal-iframe { width: 100%; height: 100%; border: 0; display:block; background:#f3f4f6; }
        .op-cell { white-space: nowrap; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header">聊天记录查询</div>
        <div id="errorBox" class="error" style="display:none"></div>
        <div class="form">
            <div class="field">
                <label>卡密</label>
                <input id="cardKey" type="text" maxlength="64" placeholder="输入卡密">
            </div>
            <div class="field">
                <label>线路</label>
                <select id="line">
                    <option value="">全部</option>
                    <th:block th:each="r: ${routes}">
                        <option th:value="${r.routeValue}" th:text="${r.routeName}"></option>
                    </th:block>
                </select>
            </div>
            <div class="field">
                <label>平台</label>
                <select id="platform">
                    <option value="">全部</option>
                    <th:block th:each="p: ${platforms}">
                        <option th:value="${p}" th:text="${p}"></option>
                    </th:block>
                </select>
            </div>
            <div class="field">
                <label>手机号/微信号</label>
                <input id="phone" type="text" maxlength="32" placeholder="输入手机号或微信号">
            </div>
        </div>
        <div class="actions">
            <button id="searchBtn" class="btn primary">查询</button>
            <button id="resetBtn" class="btn">重置</button>
            <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
                <label style="font-size:12px;color:#6b7280">每页</label>
                <select id="pageSize" style="height:28px;border:1px solid #d1d5db;border-radius:6px">
                    <option>10</option><option>20</option><option>50</option><option>100</option>
                </select>
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>卡密</th>
                    <th>线路</th>
                    <th>平台</th>
                    <th>手机号/微信号</th>
                    <th>用户名称</th>
                    <th>用户头像</th>
                    <th>创建时间</th>
                    <th>聊天记录</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody id="resultBody">
                </tbody>
            </table>
        </div>
        <div id="pager" class="pagination"></div>
    </div>
</div>

<!-- 预览弹窗 -->
<div id="chatModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-header">
            <div class="title">聊天内容预览</div>
            <button id="closeModalBtn" class="close-btn">关闭</button>
        </div>
        <div class="modal-body">
            <iframe id="chatFrame" class="modal-iframe" title="查看截图"></iframe>
        </div>
    </div>
 </div>

<script>
    const q = new URLSearchParams(window.location.search);
    if (q.get('erbao') !== 'zhr') { document.body.innerHTML=''; }
    const errorBox = document.getElementById('errorBox');
    const cardKey = document.getElementById('cardKey');
    const line = document.getElementById('line');
    const platform = document.getElementById('platform');
    const phone = document.getElementById('phone');
    const searchBtn = document.getElementById('searchBtn');
    const resetBtn = document.getElementById('resetBtn');
    const pageSizeSel = document.getElementById('pageSize');
    const resultBody = document.getElementById('resultBody');
    const pager = document.getElementById('pager');
    const modal = document.getElementById('chatModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const chatFrame = document.getElementById('chatFrame');

    let page = 0;
    let size = parseInt(pageSizeSel.value, 10);

    function showError(msg) { errorBox.style.display='block'; errorBox.textContent=msg; }
    function clearError() { errorBox.style.display='none'; errorBox.textContent=''; }
    function validate() {
        const pf = platform.value.trim();
        if (pf && !['dy','xhs','sph'].includes(pf)) { showError('平台参数不合法'); return false; }
        if (cardKey.value.length > 64 || phone.value.length > 32) { showError('参数长度不合法'); return false; }
        return true;
    }
    function buildUrl() {
        const s = new URLSearchParams();
        if (cardKey.value.trim()) s.append('cardKey', cardKey.value.trim());
        if (line.value.trim()) s.append('line', line.value.trim());
        if (platform.value.trim()) s.append('platform', platform.value.trim());
        if (phone.value.trim()) s.append('phone', phone.value.trim());
        s.append('page', page);
        s.append('size', size);
        return '/card-message/list?' + s.toString();
    }
    function renderRows(data) {
        resultBody.innerHTML = '';
        if (!data || !Array.isArray(data) || data.length === 0) return;
        data.forEach(it => {
            const tr = document.createElement('tr');
            const cj = (it.chatMessage||'').toString();
            const cjShort = cj.length>200 ? (cj.slice(0,200)+"...") : cj;
            const up = (it.userPic||'').toString();
            const upHtml = up ? `<img src="${up}" alt="" style="height:36px;width:36px;object-fit:cover;border-radius:50%;border:1px solid #e5e7eb">` : '-';
            tr.innerHTML = `<td>${it.id}</td><td>${it.cardKey||''}</td><td>${it.line||''}</td><td>${it.platform||''}</td><td>${it.phone||''}</td><td>${it.userName||''}</td><td>${upHtml}</td><td>${it.createTime||''}</td><td style="max-width:480px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${cjShort}</td><td class="op-cell"></td>`;

            const opCell = tr.querySelector('.op-cell');
            const viewBtn = document.createElement('button');
            viewBtn.className = 'btn';
            viewBtn.textContent = '查看截图';
            viewBtn.onclick = () => openChatModal(it);
            opCell.appendChild(viewBtn);
            resultBody.appendChild(tr);
        });
    }
    function openChatModal(item) {
        const s = new URLSearchParams();
        s.append('xianshiname', 'true');
        if ((item.platform||'').toString().trim()) s.append('platform', (item.platform||'').toString());
        if ((item.line||'').toString().trim()) s.append('xianlu', (item.line||'').toString());
        if ((item.userName||'').toString().trim()) s.append('userName', (item.userName||'').toString());
        if ((item.userPic||'').toString().trim()) s.append('userAvatar', (item.userPic||'').toString());
        if ((item.chatMessage||'').toString().trim()) s.append('chatContent', (item.chatMessage||'').toString());
        chatFrame.src = '/lookchatcontent?' + s.toString();
        modal.style.display = 'flex';
        modal.setAttribute('aria-hidden','false');
    }
    function closeModal() {
        modal.style.display = 'none';
        modal.setAttribute('aria-hidden','true');
        chatFrame.src = 'about:blank';
    }
    closeModalBtn.onclick = closeModal;
    modal.onclick = (e) => { if (e.target === modal) closeModal(); };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
    function renderPager(total, pages) {
        pager.innerHTML = '';
        const prev = document.createElement('button');
        prev.className = 'page-btn';
        prev.textContent = '上一页';
        prev.disabled = page<=0;
        prev.onclick = () => { if (page>0){ page--; query(); } };
        pager.appendChild(prev);
        const info = document.createElement('span');
        info.style.margin = '0 8px';
        info.textContent = `第 ${page+1} / ${pages} 页，共 ${total} 条`;
        pager.appendChild(info);
        const next = document.createElement('button');
        next.className = 'page-btn';
        next.textContent = '下一页';
        next.disabled = page+1>=pages;
        next.onclick = () => { if (page+1<pages){ page++; query(); } };
        pager.appendChild(next);
    }
    function query() {
        clearError(); if (!validate()) return;
        searchBtn.disabled = true;
        fetch(buildUrl()).then(r => r.json().then(j => ({ ok:r.ok, j })) ).then(({ok, j}) => {
            if (!ok || !j.success) { showError(j.message||'查询失败'); return; }
            renderRows(j.data);
            renderPager(j.total, j.pages);
        }).catch(() => showError('网络错误')).finally(() => { searchBtn.disabled=false; });
    }
    searchBtn.onclick = () => { page=0; size=parseInt(pageSizeSel.value,10)||10; query(); };
    resetBtn.onclick = () => { cardKey.value=''; line.value=''; platform.value=''; phone.value=''; page=0; query(); };
</script>
</body>
</html>
