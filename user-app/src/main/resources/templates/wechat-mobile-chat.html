<!DOCTYPE html>
<html lang="zh-CN"  xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信客服</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f0f0f0;
            min-height: 100vh;
            overflow-y: auto;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .mobile-container {
            width: 420px;
            height: 812px;
            background-color: var(--container-bg, #ededed);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 顶部状态栏 */
        .status-bar {
            background-color: var(--status-bar-bg, #ededed);
            color: #000;
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .status-left {
            display: flex;
            align-items: center;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        
        .status-icon {
            width: 20px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .battery-info {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 12px;
        }

        .signal-icon, .wifi-icon {
            width: 18px;
            height: 12px;
            position: relative;
        }

        .signal-bars {
            display: flex;
            gap: 2px;
            align-items: flex-end;
        }

        .signal-bar {
            width: 3px;
            background-color: #fff;
            border-radius: 1px;
        }

        .signal-bar:nth-child(1) { height: 4px; }
        .signal-bar:nth-child(2) { height: 6px; }
        .signal-bar:nth-child(3) { height: 8px; }
        .signal-bar:nth-child(4) { height: 10px; }

        .wifi-icon::before {
            content: '📶';
            font-size: 12px;
        }

        .battery {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .battery-icon {
            width: 24px;
            height: 12px;
            border: 1px solid #fff;
            border-radius: 2px;
            position: relative;
        }

        .battery-icon::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 3px;
            width: 2px;
            height: 6px;
            background-color: #fff;
            border-radius: 0 1px 1px 0;
        }

        .battery-level {
            position: absolute;
            left: 1px;
            top: 1px;
            height: 8px;
            background-color: #4cd964;
            border-radius: 1px;
            width: 80%;
        }

        /* 聊天头部 */
        .chat-header {
            background-color: var(--chat-header-bg, #ededed);
            color: #000;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            /*border-bottom: 1px solid #d9d9d9;*/
        }

        .chat-title {
            font-size: 17px;
            font-weight: 500;
            color: #000;
        }

        .chat-subtitle {
            font-size: 13px;
            color: #999;
            margin-top: 2px;
        }

        .chat-title-container {
            text-align: left;
            margin-left: 60px;
        }

        .back-btn {
            position: absolute;
            left: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            color: #000;
        }

        .more-btn {
            position: absolute;
            right: 15px;
            font-size: 18px;
            cursor: pointer;
            color: #000;
        }

        /* 聊天内容区域 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            background-color: var(--chat-bg, #ededed);
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message.received {
            justify-content: flex-start;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 8px;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .message-content {
            max-width: 75%;
            background-color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .message.sent .message-content {
            background-color: #CEE6FD;
        }

        .siyubao-chat-img {
            max-width: 120px;
            max-height: 160px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }

        .message.received .message-content::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 12px;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-right: 8px solid #fff;
        }

        .message.sent .message-content::after {
            content: '';
            position: absolute;
            right: -8px;
            top: 12px;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 8px solid #CEE6FD;
        }

        .message-time {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin: 10px 0;
        }

        .system-message {
            font-size: 12px;
            color: #999;
            text-align: center;
            margin: 8px 0;
            padding: 0 20px;
        }

        /* 功能按钮区域 */
        .function-area {
            background-color: var(--function-area-bg, #ededed);
            /*border-top: 1px solid #d9d9d9;*/
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
        }

        .function-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.2s;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 6px 10px;
            margin: 0 12px;
            background-color: #FFFFFF;
        }

        .function-item:hover {
            opacity: 0.7;
        }

        .function-icon {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 5px;
        }

        .function-text {
            font-size: 11px;
            color: #666;
            font-weight: 400;
        }

        /* 底部输入区域 */
        .input-area {
            background-color: var(--input-area-bg, #ededed);
            height: 45px;
            display: flex;
            align-items: center;
            padding: 3px 18px;
            gap: 10px;
        }

        .voice-btn {
            width: 30px;
            height: 30px;
            background-color: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .message-input {
            flex: 1;
            height: 36px;
            border: 1px solid #d9d9d9;
            border-radius: 6px;
            padding: 0 16px;
            font-size: 16px;
            outline: none;
        }

        .message-input:focus {
            border-color: #07c160;
        }

        .emoji-btn {
            width: 30px;
            height: 30px;
            background-color: transparent;
            border: none;
            font-size: 20px;
            cursor: pointer;
        }

        .send-btn {
            width: auto;
            height: auto;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .send-btn:disabled {
            cursor: not-allowed;
        }

        /* 滚动条样式 */
        .chat-container::-webkit-scrollbar {
            width: 4px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <div class="status-left">
                <span class="current-time">14:30</span>
            </div>
            <div class="status-right">

                <!-- WiFi信号图标 -->
                <div class="status-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.07 2.93 1 9z" fill="black"/>
                        <path d="M5 13l2 2c2.76-2.76 7.24-2.76 10 0l2-2c-4.28-4.28-11.72-4.28-16 0z" fill="black"/>
                        <path d="M9 17l2 2c.83-.83 2.17-.83 3 0l2-2c-1.66-1.66-4.34-1.66-6 0z" fill="black"/>
                        <circle cx="12" cy="21" r="1" fill="black"/>
                    </svg>
                </div>
                
                <!-- 手机信号强度图标 -->
                <div class="status-icon">
                    <svg width="18" height="18" viewBox="0 0 26 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="19" width="3" height="4" fill="black"/>
                        <rect x="6" y="16" width="3" height="7" fill="black"/>
                        <rect x="11" y="13" width="3" height="10" fill="black"/>
                        <rect x="16" y="9" width="3" height="14" fill="black"/>
                        <rect x="21" y="5" width="3" height="18" fill="black"/>
                    </svg>
                </div>
                
                <!-- 第二张SIM卡信号强度图标 -->
                <div class="status-icon">
                    <svg width="18" height="18" viewBox="0 0 26 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="19" width="3" height="4" fill="black"/>
                        <rect x="6" y="16" width="3" height="7" fill="black"/>
                        <rect x="11" y="13" width="3" height="10" fill="black"/>
                        <rect x="16" y="9" width="3" height="14" fill="black"/>
                        <rect x="21" y="5" width="3" height="18" fill="black"/>
                    </svg>
                </div>
                
                <!-- 电池电量图标 -->
                <div class="battery-info">
                    <span style="font-size: 14px; line-height: 18px;">86%</span>
                    <div class="status-icon">
                        <svg width="20" height="18" viewBox="0 0 24 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="1" y="4" width="18" height="8" rx="2" stroke="black" stroke-width="1" fill="none"/>
                            <rect x="2" y="5" width="14" height="6" rx="1" fill="#4CAF50"/>
                            <rect x="20" y="6" width="2" height="4" rx="1" fill="black"/>
                            <path d="M21 7v2" stroke="#4CAF50" stroke-width="1"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

    <!-- 聊天头部 -->
    <div class="chat-header">
        <div class="back-btn">
            <i class="fa fa-angle-left text-xl"></i>
        </div>
        <div class="chat-title-container">
            <div class="chat-title-wrapper">
                <div class="chat-title" th:text="${userName}">侯大鹏15674444411</div>
                <div class="chat-subtitle">@微信/视频号</div>
            </div>
        </div>
        <div class="more-btn">
            <i class="fa fa-ellipsis-v"></i>
        </div>
    </div>

    <!-- 聊天内容区域 -->
    <div class="chat-container" id="chatContainer">
        <div class="message-time" th:text="${topTime}" th:attr="data-siyubao-top-time=1">15:17</div>
        
        <div class="message sent" data-siyubao-wrap="1">
            <div class="message-content" th:text="${welcomword}">
                你好，我需要咨询一下相关服务
            </div>
            <div class="avatar">
                <img src="https://via.placeholder.com/40x40/07c160/ffffff?text=我" th:src="${myPic}" alt="用户头像" data-siyubao-avatar="me">
            </div>
        </div>
        
        <div class="system-message">
            <span th:text="${userName}">侯大鹏15674444411</span>已接入
        </div>

        <div th:each="cm,cmStats: ${msgList}">
            <div class="message-time" th:if="${cm.showTime}" th:text="${cm.dateTimeStr}" th:attr="data-siyubao-time-for=${cmStats.index}">15:17</div>
            <div class="message received" data-siyubao-wrap="1" th:class="${cm.msgType==1?'message received':'message sent'}">
                <span th:if="${cm.msgType==1}">
                    <div class="avatar">
                        <img src="https://via.placeholder.com/40x40/576b95/ffffff?text=客" th:src="${userPic}" alt="客服头像" data-siyubao-avatar="user">
                    </div>
                </span>

                <div
                        class="message-content"
                        th:attr="data-siyubao-idx=${cmStats.index},data-siyubao-type=${cm.msgType},data-siyubao-time=${cm.dateTimeStr},data-siyubao-content=${cm.contentType}"
                >
                    <img th:if="${cm.contentType==2}" th:src="${cm.msg}" class="siyubao-chat-img">
                    <span th:if="${cm.contentType!=2}" th:text="${cm.msg}">您好！欢迎使用我们的客服服务，有什么可以帮助您的吗？</span>
                </div>

                <span th:if="${cm.msgType==2}">
                    <div class="avatar">
                        <img src="https://via.placeholder.com/40x40/07c160/ffffff?text=我"  th:src="${myPic}" alt="用户头像" data-siyubao-avatar="me">
                    </div>
                </span>
            </div>
        </div>

    </div>

    <!-- 功能按钮区域 -->
    <div class="function-area">
        <div class="function-item">
            <span class="function-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5Z" fill="#333"/>
                    <path d="M4 22c0-4.42 3.58-8 8-8s8 3.58 8 8" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </span>
            <span class="function-text">升级服务</span>
        </div>
        <div class="function-item">
            <span class="function-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M13 2L3 14h7l-1 8 12-14h-7l-1-6Z" fill="#333"/>
                </svg>
            </span>
            <span class="function-text">快捷回复</span>
        </div>
        <div class="function-item">
            <span class="function-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 11c1.93 0 3.5-1.57 3.5-3.5S17.93 4 16 4s-3.5 1.57-3.5 3.5S14.07 11 16 11Z" fill="#333"/>
                    <path d="M8 12c2.21 0 4-1.79 4-4S10.21 4 8 4 4 5.79 4 8s1.79 4 4 4Z" fill="#333"/>
                    <path d="M16 13c2.76 0 5 2.24 5 5" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                    <path d="M3 22c0-4.42 3.58-8 8-8s8 3.58 8 8" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </span>
            <span class="function-text">客户详情</span>
        </div>
    </div>

    <!-- 底部输入区域 -->
    <div class="input-area">
        <button class="voice-btn"><img src="/assets/images/yy.webp" alt="语音" style="width: 30px; height: 30px; object-fit: contain; background-color: #ededed; border-radius: 50%;"></button>
        <input type="text" class="message-input" placeholder="" id="messageInput">
        <button class="emoji-btn"><img src="/assets/images/bq.webp" alt="表情" style="width: 30px; height: 30px; object-fit: contain; background-color: #ededed; border-radius: 50%;"></button>
        <button class="send-btn" id="sendBtn" disabled><img src="/assets/images/fs.webp" alt="发送" style="width: 30px; height: 30px; object-fit: contain; background-color: #ededed; border-radius: 50%;"></button>
    </div>

    <script th:inline="javascript">
        // 更新当前时间（24小时制）
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const timeElement = document.querySelector('.current-time');
            if (timeElement) {
                timeElement.textContent = `${hours}:${minutes}`;
            }
        }

        // 每分钟更新一次时间
        updateTime();
        setInterval(updateTime, 60000);

        // 输入框功能
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatContainer = document.getElementById('chatContainer');

        // 监听输入框变化
        messageInput.addEventListener('input', function() {
            sendBtn.disabled = this.value.trim() === '';
        });

        // 发送消息
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message === '') return;

            // 创建发送的消息
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message sent';
            messageDiv.innerHTML = `
                <div class="message-content">${message}</div>
                <div class="avatar">
                    <img src="https://via.placeholder.com/40x40/07c160/ffffff?text=我" alt="用户头像">
                </div>
            `;

            chatContainer.appendChild(messageDiv);
            messageInput.value = '';
            sendBtn.disabled = true;

            // 滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 模拟客服回复
            setTimeout(() => {
                const replyDiv = document.createElement('div');
                replyDiv.className = 'message received';
                replyDiv.innerHTML = `
                    <div class="avatar">
                        <img src="https://via.placeholder.com/40x40/576b95/ffffff?text=客" alt="客服头像">
                    </div>
                    <div class="message-content">收到您的消息，我正在为您处理，请稍等...</div>
                `;
                chatContainer.appendChild(replyDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 1000);
        }

        // 点击发送按钮
        sendBtn.addEventListener('click', sendMessage);

        // 回车发送
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // 模拟电池电量变化
        function updateBattery() {
            const batteryPercent = document.querySelector('.battery-percent');
            const batteryLevel = document.querySelector('.battery-level');
            
            let currentPercent = parseInt(batteryPercent.textContent);
            if (currentPercent > 20) {
                currentPercent -= 1;
                batteryPercent.textContent = currentPercent + '%';
                batteryLevel.style.width = currentPercent + '%';
                
                if (currentPercent <= 20) {
                    batteryLevel.style.backgroundColor = '#ff3b30';
                }
            }
        }

        // 每30秒减少1%电量（仅为演示）
        setInterval(updateBattery, 30000);

        /* 设置聊天背景 */
        (function() {
            const chatBg = /*[[${chatBg}]]*/ '';
            console.log('[DEBUG] wechat-mobile-chat - chatBg:', chatBg);

            /* 只有设置了背景图片时，才设置整个页面容器背景 */
            if (chatBg && chatBg.startsWith('url')) {
                console.log('[DEBUG] wechat-mobile-chat - 设置图片背景');
                /* 整个页面使用一张完整的背景图片 */
                document.documentElement.style.setProperty('--container-bg', 'transparent');
                document.documentElement.style.setProperty('--chat-header-bg', 'transparent');
                document.documentElement.style.setProperty('--status-bar-bg', 'transparent');
                document.documentElement.style.setProperty('--chat-bg', 'transparent');
                document.documentElement.style.setProperty('--input-area-bg', 'transparent');
                document.documentElement.style.setProperty('--function-area-bg', 'transparent');

                const mobileContainer = document.querySelector('.mobile-container');
                if (mobileContainer) {
                    mobileContainer.style.background = chatBg;
                    mobileContainer.style.backgroundSize = 'cover';
                    mobileContainer.style.backgroundPosition = 'center';
                    mobileContainer.style.backgroundRepeat = 'no-repeat';
                }
            } else if (chatBg) {
                console.log('[DEBUG] wechat-mobile-chat - 设置纯色背景:', chatBg);
                /* 纯色背景 */
                document.documentElement.style.setProperty('--container-bg', chatBg);
                document.documentElement.style.setProperty('--chat-header-bg', chatBg);
                document.documentElement.style.setProperty('--status-bar-bg', chatBg);
                document.documentElement.style.setProperty('--chat-bg', chatBg);
                document.documentElement.style.setProperty('--input-area-bg', chatBg);
                document.documentElement.style.setProperty('--function-area-bg', chatBg);
            } else {
                console.log('[DEBUG] wechat-mobile-chat - 没有设置背景');
            }
        })();
    </script>
    </div>
</body>
</html>
