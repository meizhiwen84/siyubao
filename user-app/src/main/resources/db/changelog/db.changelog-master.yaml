databaseChangeLog:
  - changeSet:
      id: 20260403-01-routes-add-card-key-column
      author: trae
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - or:
            - tableExists:
                tableName: routes
            - tableExists:
                tableName: ROUTES
        - not:
            columnExists:
            tableName: routes
            columnName: card_key
      changes:
        - addColumn:
            tableName: routes
            columns:
              - column:
                  name: card_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
      rollback:
        - dropColumn:
            tableName: routes
            columnName: card_key

  - changeSet:
      id: 20260403-02-routes-create-card-key-index
      author: trae
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - or:
            - tableExists:
                tableName: routes
            - tableExists:
                tableName: ROUTES
        - columnExists:
            tableName: routes
            columnName: card_key
        - not:
            indexExists:
            tableName: routes
            indexName: idx_routes_card_key
      changes:
        - createIndex:
            tableName: routes
            indexName: idx_routes_card_key
            columns:
              - column:
                  name: card_key
      rollback:
        - dropIndex:
            tableName: routes
            indexName: idx_routes_card_key

  - changeSet:
      id: 20260406-01-routes-scope-unique-by-card-key
      author: trae
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - or:
            - tableExists:
                tableName: routes
            - tableExists:
                tableName: ROUTES
        - columnExists:
            tableName: routes
            columnName: card_key
        - not:
            indexExists:
              tableName: routes
              indexName: uk_routes_card_key_route_name
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE routes__tmp (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                card_key VARCHAR(255),
                route_name VARCHAR(100) NOT NULL,
                route_value VARCHAR(500) NOT NULL,
                douyin_avatar VARCHAR(500),
                shipin_avatar VARCHAR(500),
                xiaohongshu_avatar VARCHAR(500),
                welcome_message VARCHAR(1000),
                status INTEGER NOT NULL,
                create_time DATETIME NOT NULL,
                update_time DATETIME NOT NULL
              );
              INSERT INTO routes__tmp (
                id, card_key, route_name, route_value,
                douyin_avatar, shipin_avatar, xiaohongshu_avatar,
                welcome_message, status, create_time, update_time
              )
              SELECT
                id, card_key, route_name, route_value,
                douyin_avatar, shipin_avatar, xiaohongshu_avatar,
                welcome_message, status, create_time, update_time
              FROM routes;
              DROP TABLE routes;
              ALTER TABLE routes__tmp RENAME TO routes;
              CREATE INDEX IF NOT EXISTS idx_routes_card_key ON routes(card_key);
              CREATE UNIQUE INDEX uk_routes_card_key_route_name ON routes(card_key, route_name);
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              DROP INDEX IF EXISTS uk_routes_card_key_route_name;

  - changeSet:
      id: 20260406-02-routes-fix-null-id
      author: trae
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            tableName: routes
        - sqlCheck:
            expectedResult: "1"
            sql: "SELECT CASE WHEN EXISTS(SELECT 1 FROM routes WHERE id IS NULL OR CAST(id AS TEXT) = '') THEN 1 ELSE 0 END"
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE routes__tmp2 (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                card_key VARCHAR(255),
                route_name VARCHAR(100) NOT NULL,
                route_value VARCHAR(500) NOT NULL,
                douyin_avatar VARCHAR(500),
                shipin_avatar VARCHAR(500),
                xiaohongshu_avatar VARCHAR(500),
                welcome_message VARCHAR(1000),
                status INTEGER NOT NULL,
                create_time DATETIME NOT NULL,
                update_time DATETIME NOT NULL
              );
              INSERT INTO routes__tmp2 (
                id, card_key, route_name, route_value,
                douyin_avatar, shipin_avatar, xiaohongshu_avatar,
                welcome_message, status, create_time, update_time
              )
              SELECT
                CASE
                  WHEN id IS NULL THEN NULL
                  WHEN CAST(id AS TEXT) = '' THEN NULL
                  WHEN typeof(id) = 'integer' THEN id
                  WHEN typeof(id) = 'text' AND id GLOB '[0-9]*' AND id <> '' THEN CAST(id AS INTEGER)
                  ELSE NULL
                END AS id,
                card_key, route_name, route_value,
                douyin_avatar, shipin_avatar, xiaohongshu_avatar,
                welcome_message, status, create_time, update_time
              FROM routes;
              DROP TABLE routes;
              ALTER TABLE routes__tmp2 RENAME TO routes;
              CREATE INDEX IF NOT EXISTS idx_routes_card_key ON routes(card_key);
              CREATE UNIQUE INDEX IF NOT EXISTS uk_routes_card_key_route_name ON routes(card_key, route_name);
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              DROP INDEX IF EXISTS uk_routes_card_key_route_name;

  - changeSet:
      id: 20260406-03-card-key-message-fix-chat-column
      author: trae
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            tableName: card_key_message
        - sqlCheck:
            expectedResult: "1"
            sql: "SELECT CASE WHEN EXISTS(SELECT 1 FROM pragma_table_info('card_key_message') WHERE name='chat_essage') THEN 1 ELSE 0 END"
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE card_key_message__tmp (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                card_key VARCHAR(255) NOT NULL,
                line VARCHAR(255),
                platform VARCHAR(64),
                phone VARCHAR(255),
                user_name VARCHAR(255),
                user_pic VARCHAR(500),
                chat_message TEXT,
                create_time DATETIME
              );
              INSERT INTO card_key_message__tmp (
                id, card_key, line, platform, phone, user_name, user_pic, chat_message, create_time
              )
              SELECT
                CASE
                  WHEN id IS NULL THEN NULL
                  WHEN CAST(id AS TEXT) = '' THEN NULL
                  WHEN typeof(id) = 'integer' THEN id
                  WHEN typeof(id) = 'text' AND id GLOB '[0-9]*' AND id <> '' THEN CAST(id AS INTEGER)
                  ELSE NULL
                END AS id,
                card_key, line, platform, phone, user_name, user_pic, chat_essage, create_time
              FROM card_key_message;
              DROP TABLE card_key_message;
              ALTER TABLE card_key_message__tmp RENAME TO card_key_message;
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              DROP TABLE IF EXISTS card_key_message;

  - changeSet:
      id: 20260406-04-card-key-message-fix-id-type
      author: trae
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - tableExists:
            tableName: card_key_message
        - sqlCheck:
            expectedResult: "1"
            sql: "SELECT CASE WHEN EXISTS(SELECT 1 FROM pragma_table_info('card_key_message') WHERE name='id' AND pk=1 AND lower(type)='integer') THEN 0 ELSE 1 END"
      changes:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              CREATE TABLE card_key_message__tmp2 (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                card_key VARCHAR(255) NOT NULL,
                line VARCHAR(255),
                platform VARCHAR(64),
                phone VARCHAR(255),
                user_name VARCHAR(255),
                user_pic VARCHAR(500),
                chat_message TEXT,
                create_time DATETIME
              );
              INSERT INTO card_key_message__tmp2 (
                id, card_key, line, platform, phone, user_name, user_pic, chat_message, create_time
              )
              SELECT
                CASE
                  WHEN id IS NULL THEN NULL
                  WHEN CAST(id AS TEXT) = '' THEN NULL
                  WHEN typeof(id) = 'integer' THEN id
                  WHEN typeof(id) = 'text' AND id GLOB '[0-9]*' AND id <> '' THEN CAST(id AS INTEGER)
                  ELSE NULL
                END AS id,
                card_key, line, platform, phone, user_name, user_pic, chat_message, create_time
              FROM card_key_message;
              DROP TABLE card_key_message;
              ALTER TABLE card_key_message__tmp2 RENAME TO card_key_message;
      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              DROP TABLE IF EXISTS card_key_message;

  - changeSet:
      id: 20260407-01-local-card-key-table
      author: trae
      preConditions:
        - onFail: MARK_RAN
        - onError: HALT
        - not:
            tableExists:
