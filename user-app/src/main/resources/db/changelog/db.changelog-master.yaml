      rollback:
        - sql:
            splitStatements: true
            stripComments: true
            sql: |
              DROP INDEX IF EXISTS idx_chat_message_history_user_id_time;

              CREATE TABLE chat_message_history__tmp6_rb (
                id INTEGER PRIMARY KEY AUTOINCREMENT,
                user_id BIGINT,
                card_key VARCHAR(255),
                line VARCHAR(255),
                platform VARCHAR(64),
                phone VARCHAR(255),
                user_name VARCHAR(255),
                user_pic VARCHAR(500),
                chat_message TEXT,
                create_time DATETIME
              );

              INSERT INTO chat_message_history__tmp6_rb (
                id, user_id, card_key, line, platform, phone, user_name, user_pic, chat_message, create_time
              )
              SELECT
                id, user_id, NULL, line, platform, phone, user_name, user_pic, chat_message, create_time
              FROM chat_message_history;

              DROP TABLE chat_message_history;
              ALTER TABLE chat_message_history__tmp6_rb RENAME TO chat_message_history;

              CREATE INDEX IF NOT EXISTS idx_chat_message_history_user_id_time ON chat_message_history(user_id, create_time);

  - changeSet:
      id: 20260415-01-add-user-no-to-local-user-session
      author: trae
