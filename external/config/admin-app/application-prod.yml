server:
  port: ${port}

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/siyubao?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${dbu}
    password: ${dbp}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  devtools:
    restart:
      enabled: false
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

sxjw:
  seed:
    mode: PROD
  admin:
    init-username: ${adminuname}
    init-password: ${adminpwd}
    force-reset: false


logging:
  file:
    path: /opt/laoba/siyubaoadmin/logs
  level:
    root: INFO


siyubao:
  upload:
    dir: /opt/laoba/siyubaoadmin/uploads
    url-prefix: /uploads
